<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رسالة خاصة ❤️</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 10%,#ffc1d9 0,transparent 30%),
    radial-gradient(circle at 90% 90%,#ffd6e7 0,transparent 30%),
    linear-gradient(135deg,#ffe8f0,#fff6f9);
}

/* القلوب بالخلفية */

body::before{
    content:"❤️  💕  💗  💖  💕  ❤️";
    position:fixed;
    top:12px;
    left:0;
    width:100%;
    text-align:center;
    font-size:24px;
    opacity:.35;
    letter-spacing:5px;
    pointer-events:none;
}

.card{
    width:100%;
    max-width:390px;

    padding:22px;

    background:rgba(255,240,245,.97);

    border:3px solid #ffb6c1;

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 18px 45px rgba(255,70,140,.25),
    inset 0 0 20px rgba(255,255,255,.8);

    animation:showCard .7s ease;
}

@keyframes showCard{
    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.title{
    color:#d63384;
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:#ff69b4;
    font-size:13px;
    margin-bottom:8px;
}

.image-container{
    width:100%;
    height:230px;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:8px;
}

.image-container img{
    width:215px;
    height:215px;

    object-fit:contain;

    transition:.35s;

    filter:drop-shadow(0 8px 12px rgba(255,80,150,.22));
}

.text-box{
    min-height:78px;

    padding:14px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff;

    border:2px solid #ff69b4;

    border-radius:18px;

    color:#333;

    font-size:17px;

    line-height:1.8;

    margin-bottom:20px;

    box-shadow:
    inset 0 2px 6px rgba(0,0,0,.04),
    0 5px 12px rgba(255,105,180,.08);
}

.btn{
    background:linear-gradient(135deg,#ff69b4,#ff4081);

    color:white;

    border:none;

    padding:12px 35px;

    border-radius:25px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 6px 15px rgba(255,70,140,.3);

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:scale(.93);
}

/* القلب */

#heart-btn{
    display:none;

    border:none;
    background:none;

    font-size:70px;

    cursor:pointer;

    animation:heartBeat .75s infinite alternate;
}

@keyframes heartBeat{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.2);
    }

}

.hearts{
    margin-top:15px;
    font-size:18px;
    letter-spacing:4px;
}

.progress{
    width:100%;
    height:5px;

    background:#ffd5e3;

    border-radius:10px;

    margin-top:15px;

    overflow:hidden;
}

.progress-bar{
    width:16.6%;
    height:100%;

    background:linear-gradient(90deg,#ff69b4,#ff4081);

    border-radius:10px;

    transition:.4s;
}

@media(max-width:450px){

    .card{
        padding:18px;
    }

    .image-container{
        height:205px;
    }

    .image-container img{
        width:190px;
        height:190px;
    }

    .text-box{
        font-size:16px;
    }

}

</style>
</head>


<body>

/*
==================================================
 ترتيب الرسائل
==================================================
*/

const steps = [

    {
        text:"هلو ضي ❤️",
        btnText:"انقر؟",
        image:0,
        type:"button"
    },

    {
        text:"ضي عندي سؤال الججج 🤭",
        btnText:"شنو هو؟",
        image:1,
        type:"button"
    },

    {
        text:"بس مستحي أسألج إياه 🫣",
        btnText:"اسالني",
        image:1,
        type:"button"
    },

    {
        text:"تحبين عادل لو لا؟! 🧐",
        btnText:"ها؟ 🤨",
        image:2,
        type:"button"
    },

    {
        text:"إذا تحبين عادل دوسي على القلب 💛",
        image:3,
        type:"heart"
    },

    {
        text:"إن الحياة من محاسن صُدفك تبعت شخصاً جميلاً كامل الأوصاف... فعماذا فعلت لكي يأتي بمعكِ؟ أعشقك وأحبج 🥹❤️",
        btnText:"العودة للبداية",
        image:4,
        type:"button"
    }

];


let step = 0;


/*
==================================================
 تشغيل أول صورة
==================================================
*/

document.getElementById("kitty-img").src =
    images[steps[0].image];


/*
==================================================
 الزر التالي
==================================================
*/

function nextStep(){

    step++;

    if(step >= steps.length){
        step = 0;
    }

    updateContent();
}


/*
==================================================
 الضغط على القلب
==================================================
*/

function finalStep(){

    step = 5;

    updateContent();
}


/*
==================================================
 تحديث الصفحة
==================================================
*/

function updateContent(){

    const current = steps[step];

    const text =
        document.getElementById("text-content");

    const image =
        document.getElementById("kitty-img");

    const normalButton =
        document.getElementById("action-btn");

    const heartButton =
        document.getElementById("heart-btn");

    const progress =
        document.getElementById("progress-bar");


    /*
    تغيير النص
    */

    text.innerText = current.text;


    /*
    تأثير الصورة
    */

    image.style.opacity = "0";
    image.style.transform = "scale(.75)";


    setTimeout(function(){

        image.src = images[current.image];

        image.style.opacity = "1";
        image.style.transform = "scale(1)";

    },150);


    /*
    شريط التقدم
    */

    progress.style.width =
        ((step + 1) / steps.length * 100) + "%";


    /*
    زر القلب
    */

    if(current.type === "heart"){

        normalButton.style.display = "none";

        heartButton.style.display = "block";

    }

    else{

        normalButton.style.display = "inline-block";

        normalButton.innerText =
            current.btnText;

        heartButton.style.display = "none";

    }

}

</script>
