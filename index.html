
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>رسالة صغيرة 💕</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
}

body{
    min-height:100dvh;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6,#ffdbea);
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    overflow:hidden;
}

/* الكرت */

.card{
    width:100%;
    max-width:420px;
    max-height:calc(100dvh - 24px);
    background:rgba(255,255,255,.94);
    border-radius:28px;
    padding:20px 16px 18px;
    box-shadow:0 15px 45px rgba(180,70,120,.22);
    text-align:center;
    overflow:auto;
    scrollbar-width:none;
}

.card::-webkit-scrollbar{
    display:none;
}

/* العنوان */

.title{
    color:#e83e78;
    font-size:24px;
    font-weight:bold;
    margin-bottom:6px;
}

.subtitle{
    color:#777;
    font-size:15px;
    margin-bottom:12px;
}

/* الصورة */

.image-container{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:5px 0 12px;
}

#kitty-img{
    display:block;
    width:min(72vw,280px);
    height:min(72vw,280px);
    max-width:280px;
    max-height:280px;
    object-fit:contain;
    border-radius:24px;
    transition:opacity .2s ease,transform .2s ease;
}

/* مربع الكلام */

.text-box{
    background:#fff0f6;
    border:2px solid #ffd0e1;
    color:#d62f6c;
    border-radius:18px;
    padding:14px 12px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1.7;
    margin-bottom:12px;
}

/* الأزرار */

button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:14px 16px;
    font-family:inherit;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
    touch-action:manipulation;
}

button:active{
    transform:scale(.96);
}

#action-btn{
    background:#ff4f91;
    color:white;
    box-shadow:0 7px 18px rgba(255,79,145,.28);
}

#heart-btn{
    display:none;
    background:#ff3d7f;
    color:white;
    font-size:30px;
    min-height:68px;
    box-shadow:0 8px 22px rgba(255,61,127,.35);
    animation:pulse 1.2s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

/* القلوب */

.hearts{
    font-size:20px;
    letter-spacing:7px;
    margin:12px 0 9px;
}

/* شريط التقدم */

.progress{
    width:100%;
    height:7px;
    background:#ffe0eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:16.66%;
    height:100%;
    background:#ff4f91;
    border-radius:20px;
    transition:width .3s ease;
}

/* الهاتف */

@media(max-width:380px){

    body{
        padding:8px;
    }

    .card{
        max-height:calc(100dvh - 16px);
        border-radius:23px;
        padding:16px 12px;
    }

    .title{
        font-size:21px;
    }

    .subtitle{
        font-size:14px;
    }

    #kitty-img{
        width:220px;
        height:220px;
    }

    .text-box{
        font-size:15px;
        padding:11px 9px;
    }

    button{
        font-size:16px;
        padding:12px;
    }

}

/* الشاشات القصيرة */

@media(max-height:650px){

    .card{
        padding-top:12px;
        padding-bottom:12px;
    }

    .title{
        font-size:20px;
    }

    .image-container{
        margin:3px 0 7px;
    }

    #kitty-img{
        width:190px;
        height:190px;
    }

    .text-box{
        min-height:55px;
        padding:9px;
        margin-bottom:8px;
    }

    .hearts{
        margin:7px 0;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="title">
        💕 رسالة صغيرة 💕
    </div>

    <div class="subtitle">
        إلى ضي ❤️
    </div>

    <div class="image-container">
        <img id="kitty-img" alt="صورة">
    </div>

    <div class="text-box" id="text-content">
        هلو ضي ❤️
    </div>

    <button id="action-btn" onclick="nextStep()">
        انقر؟
    </button>

    <button id="heart-btn" onclick="finalStep()">
        💖
    </button>

    <div class="hearts">
        💗 💕 💗
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

</div>


<script>

/*
====================================================
 الصور
====================================================

مهم:
هذه الصور مرسومة بالكامل بالأشكال فقط.
لا يوجد داخلها أي نص أو كتابة.
====================================================
*/

function svgImage(content){

    return "data:image/svg+xml;charset=UTF-8," +
           encodeURIComponent(
`
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 500">

${content}

</svg>
`
           );
}


/* الصورة الأولى */

const image1 = svgImage(`

<rect width="500" height="500"
      rx="80"
      fill="#ffd6e5"/>

<ellipse cx="250" cy="270"
         rx="145" ry="130"
         fill="#ffffff"
         stroke="#333"
         stroke-width="8"/>

<path d="M135 180
         L110 70
         Q108 55 125 62
         L205 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<path d="M365 180
         L390 70
         Q392 55 375 62
         L295 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<ellipse cx="195" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="305" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="250" cy="282"
         rx="13" ry="10"
         fill="#ffd84d"/>

<ellipse cx="155" cy="300"
         rx="27" ry="14"
         fill="#ff9fbc"/>

<ellipse cx="345" cy="300"
         rx="27" ry="14"
         fill="#ff9fbc"/>

<circle cx="350" cy="155"
        r="28"
        fill="#ff69b4"/>

<circle cx="395" cy="145"
        r="28"
        fill="#ff69b4"/>

<circle cx="372" cy="170"
        r="13"
        fill="#ff4081"/>

`);


/* الصورة الثانية */

const image2 = svgImage(`

<rect width="500" height="500"
      rx="80"
      fill="#ffe1ed"/>

<ellipse cx="250" cy="270"
         rx="145" ry="130"
         fill="#ffffff"
         stroke="#333"
         stroke-width="8"/>

<path d="M135 180
         L110 70
         L205 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<path d="M365 180
         L390 70
         L295 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<ellipse cx="195" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="305" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="250" cy="282"
         rx="13" ry="10"
         fill="#ffd84d"/>

<ellipse cx="158" cy="300"
         rx="28" ry="14"
         fill="#ff8faf"/>

<ellipse cx="342" cy="300"
         rx="28" ry="14"
         fill="#ff8faf"/>

<path d="M235 320
         Q250 330 265 320"
      fill="none"
      stroke="#333"
      stroke-width="6"/>

`);


/* الصورة الثالثة */

const image3 = svgImage(`

<rect width="500" height="500"
      rx="80"
      fill="#ffd5e5"/>

<ellipse cx="250" cy="270"
         rx="145" ry="130"
         fill="#ffffff"
         stroke="#333"
         stroke-width="8"/>

<path d="M135 180
         L110 70
         L205 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<path d="M365 180
         L390 70
         L295 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<ellipse cx="195" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="305" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="250" cy="282"
         rx="13" ry="10"
         fill="#ffd84d"/>

<circle cx="350" cy="155"
        r="28"
        fill="#ff69b4"/>

<circle cx="395" cy="145"
        r="28"
        fill="#ff69b4"/>

<circle cx="372" cy="170"
        r="13"
        fill="#ff4081"/>

`);


/* صورة القلب */

const imageHeart = svgImage(`

<rect width="500" height="500"
      rx="80"
      fill="#ffe1ed"/>

<path d="
M250 400

C225 370 80 280 80 175

C80 95 180 75 225 140

L250 175

L275 140

C320 75 420 95 420 175

C420 280 275 370 250 400 Z"

fill="#ff4081"
stroke="#ffffff"
stroke-width="10"/>

`);


/* الصورة الأخيرة */

const image5 = svgImage(`

<rect width="500" height="500"
      rx="80"
      fill="#ffdbea"/>

<ellipse cx="250" cy="270"
         rx="150" ry="135"
         fill="#ffffff"
         stroke="#333"
         stroke-width="8"/>

<path d="M130 180
         L110 70
         L205 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<path d="M370 180
         L390 70
         L295 125 Z"
      fill="#ffffff"
      stroke="#333"
      stroke-width="8"/>

<ellipse cx="195" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="305" cy="260"
         rx="11" ry="18"
         fill="#222"/>

<ellipse cx="250" cy="282"
         rx="13" ry="10"
         fill="#ffd84d"/>

<ellipse cx="158" cy="300"
         rx="28" ry="14"
         fill="#ff8faf"/>

<ellipse cx="342" cy="300"
         rx="28" ry="14"
         fill="#ff8faf"/>

<circle cx="350" cy="155"
        r="28"
        fill="#ff69b4"/>

<circle cx="395" cy="145"
        r="28"
        fill="#ff69b4"/>

<circle cx="372" cy="170"
        r="13"
        fill="#ff4081"/>

`);


/*
====================================================
 قائمة الصور
====================================================
*/

const images = [

    image1,
    image2,
    image3,
    imageHeart,
    image5

];


/*
====================================================
 الرسائل
====================================================
*/

const steps = [

    {
        text:"هلو ضي ❤️",
        btnText:"انقر؟",
        image:0,
        type:"button"
    },

    {
        text:"ضي عندي سؤال الججج 🤭",
        btnText:"شنو هو؟",
        image:1,
        type:"button"
    },

    {
        text:"بس مستحي أسألج إياه 🫣",
        btnText:"اسألني",
        image:1,
        type:"button"
    },

    {
        text:"تحبين عادل لو لا؟! 🧐",
        btnText:"ها؟ 🤨",
        image:2,
        type:"button"
    },

    {
        text:"إذا تحبين عادل دوسي على القلب 💛",
        image:3,
        type:"heart"
    },

    {
        text:"إن الحياة من محاسن صُدفك تبعت شخصاً جميلاً كامل الأوصاف... فعماذا فعلت لكي يأتي بمعكِ؟ أعشقك وأحبج 🥹❤️",
        btnText:"العودة للبداية",
        image:4,
        type:"button"
    }

];


/*
====================================================
 المتغيرات
====================================================
*/

let step = 0;


/*
====================================================
 العناصر
====================================================
*/

const kittyImg =
    document.getElementById("kitty-img");

const textContent =
    document.getElementById("text-content");

const actionBtn =
    document.getElementById("action-btn");

const heartBtn =
    document.getElementById("heart-btn");

const progressBar =
    document.getElementById("progress-bar");


/*
====================================================
 الصورة الأولى
====================================================
*/

kittyImg.src = images[0];


/*
====================================================
 الانتقال للرسالة التالية
====================================================
*/

function nextStep(){

    step++;

    if(step >= steps.length){

        step = 0;

    }

    updateContent();

}


/*
====================================================
 عند الضغط على القلب
====================================================
*/

function finalStep(){

    step = 5;

    updateContent();

}


/*
====================================================
 تحديث الشاشة
====================================================
*/

function updateContent(){

    const current = steps[step];


    /*
    تغيير الكلام
    */

    textContent.textContent =
        current.text;


    /*
    تأثير تغيير الصورة
    */

    kittyImg.style.opacity = "0";

    kittyImg.style.transform =
        "scale(.75)";


    setTimeout(function(){

        kittyImg.src =
            images[current.image];

        kittyImg.style.opacity =
            "1";

        kittyImg.style.transform =
            "scale(1)";

    },150);


    /*
    شريط التقدم
    */

    progressBar.style.width =
        ((step + 1) / steps.length * 100) + "%";


    /*
    إظهار زر القلب
    */

    if(current.type === "heart"){

        actionBtn.style.display =
            "none";

        heartBtn.style.display =
            "block";

    }

    else{

        actionBtn.style.display =
            "block";

        actionBtn.textContent =
            current.btnText;

        heartBtn.style.display =
            "none";

    }

}


/*
====================================================
 منع تحديد الصور
====================================================
*/

kittyImg.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

    }
);

</script>

</body>
</html>
